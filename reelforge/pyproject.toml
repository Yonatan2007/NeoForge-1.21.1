[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelforge"
version = "1.0.0"
description = "Script in, ready-to-post 9:16 voiceover reel out (Higgsfield voice, stock B-roll, animated captions)."
requires-python = ">=3.10"
dependencies = [
    "moviepy>=2.1,<3",
    "numpy>=1.24",
    "Pillow>=10",
    "requests>=2.31",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
piper = ["piper-tts>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
reelforge = "reelforge.cli:main"

[tool.setuptools]
packages = ["reelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:moviepy.*"]
